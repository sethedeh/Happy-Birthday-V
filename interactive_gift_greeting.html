<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise for You!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tone.js for web audio sounds -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap');

        body {
            font-family: 'Fredoka', sans-serif;
            background: radial-gradient(circle, #fbcfe8 0%, #f472b6 50%, #db2777 100%);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-pacifico {
            font-family: 'Pacifico', cursive;
        }

        /* Float animation for the pointer sign */
        @keyframes float-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-14px) scale(1.05); }
        }

        .animate-float {
            animation: float-bounce 2s ease-in-out infinite;
        }

        /* Pulse glow for button */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(244, 114, 182, 0.6), 0 0 30px rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 25px rgba(244, 114, 182, 0.9), 0 0 50px rgba(236, 72, 153, 0.7); }
        }

        .pulse-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Gift box 3D hover shake */
        .gift-box {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .gift-box:hover {
            transform: scale(1.08) rotate(-2deg);
        }

        .gift-box:active {
            transform: scale(0.95);
        }

        /* Custom wiggle when tapped */
        @keyframes wiggle {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-8deg) scale(1.1); }
            40% { transform: rotate(8deg) scale(1.1); }
            60% { transform: rotate(-5deg) scale(1.05); }
            80% { transform: rotate(5deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .animate-wiggle {
            animation: wiggle 0.6s ease-in-out;
        }

        /* Floating background elements */
        .floating-bg-item {
            position: absolute;
            pointer-events: none;
            opacity: 0.35;
            animation: float-bg 8s ease-in-out infinite alternate;
        }

        @keyframes float-bg {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-40px) rotate(15deg); }
        }

        /* Text Glow Effect */
        .text-glow {
            text-shadow: 0 0 10px #ffffff, 0 0 20px #f472b6, 0 0 30px #ec4899, 0 0 40px #db2777;
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center relative overflow-hidden text-slate-800">

    <!-- Background Floating Decorations -->
    <div id="bg-decorations" class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="floating-bg-item text-4xl top-10 left-10" style="animation-delay: 0s;">🌸</div>
        <div class="floating-bg-item text-5xl top-1/4 right-12" style="animation-delay: 1s;">✨</div>
        <div class="floating-bg-item text-4xl bottom-20 left-16" style="animation-delay: 2s;">🎀</div>
        <div class="floating-bg-item text-6xl bottom-12 right-20" style="animation-delay: 3s;">💖</div>
        <div class="floating-bg-item text-3xl top-12 right-1/3" style="animation-delay: 1.5s;">🎈</div>
        <div class="floating-bg-item text-5xl bottom-1/3 left-1/4" style="animation-delay: 2.5s;">🌟</div>
    </div>

    <!-- Canvas for Floating Balloons/Ribbons Post Reveal -->
    <canvas id="effects-canvas" class="fixed inset-0 pointer-events-none z-20"></canvas>

    <!-- Main Interactive Container -->
    <main class="relative z-10 flex flex-col items-center justify-center p-4 w-full max-w-lg text-center">

        <!-- Initial Unopened State Container -->
        <div id="gift-stage" class="flex flex-col items-center transition-all duration-700 transform scale-100 opacity-100">

            <!-- Floating Pointing Sign -->
            <div id="pointer-sign" class="animate-float mb-6 relative flex flex-col items-center">
                <div class="bg-white/90 backdrop-blur-md px-6 py-3 rounded-full shadow-2xl border-2 border-pink-300 flex items-center gap-2 pulse-glow">
                    <span class="text-pink-600 font-bold text-lg md:text-xl tracking-wide">✨ TAP THE BOX! ✨</span>
                </div>
                <!-- Arrow Down Icon -->
                <div class="text-white drop-shadow-md mt-1 animate-bounce">
                    <i data-lucide="arrow-down-big" class="w-10 h-10 fill-pink-500 text-white"></i>
                </div>
            </div>

            <!-- Pink Gift Box Wrapper -->
            <div id="gift-box" class="gift-box relative group p-4" onclick="openGift()">
                <!-- Aura Glow behind box -->
                <div class="absolute inset-0 bg-pink-300/50 rounded-full blur-2xl group-hover:bg-pink-200/70 transition-all"></div>

                <!-- Box Graphic (SVG) -->
                <div class="relative w-56 h-56 md:w-64 md:h-64 drop-shadow-2xl">
                    <svg viewBox="0 0 200 200" class="w-full h-full">
                        <!-- Box Body -->
                        <rect x="30" y="80" width="140" height="100" rx="12" fill="#f472b6" stroke="#db2777" stroke-width="4"/>
                        <!-- Box Front Ribbon Vertical -->
                        <rect x="85" y="80" width="30" height="100" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/>
                        
                        <!-- Box Shadow Under Lid -->
                        <rect x="22" y="76" width="156" height="12" rx="4" fill="#be185d" opacity="0.2"/>

                        <!-- Box Lid -->
                        <g id="box-lid" class="transition-transform duration-500 origin-top">
                            <rect x="20" y="50" width="160" height="32" rx="8" fill="#f472b6" stroke="#db2777" stroke-width="4"/>
                            <!-- Lid Ribbon Vertical -->
                            <rect x="85" y="50" width="30" height="32" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/>
                            <!-- Big Ribbon Bow Top -->
                            <!-- Left Loop -->
                            <path d="M70,50 C40,20 40,40 85,50 Z" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/>
                            <!-- Right Loop -->
                            <path d="M130,50 C160,20 160,40 115,50 Z" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/>
                            <!-- Center Knot -->
                            <circle cx="100" cy="50" r="12" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
                            <circle cx="100" cy="50" r="6" fill="#fce7f3"/>
                        </g>
                    </svg>
                </div>
            </div>

            <p class="text-white/90 text-sm font-medium mt-4 backdrop-blur-sm bg-black/10 px-4 py-1.5 rounded-full">
                🔊 Sound on for full celebration!
            </p>
        </div>

        <!-- Revealed Greeting Stage (Hidden initially) -->
        <div id="reveal-stage" class="hidden flex-col items-center justify-center transition-all duration-1000 transform scale-50 opacity-0 my-auto">
            
            <!-- Greeting Card Wrapper -->
            <div class="bg-white/90 backdrop-blur-xl p-8 md:p-10 rounded-3xl shadow-2xl border-4 border-pink-200 relative max-w-md w-full">
                
                <!-- Floating corner ribbons on card -->
                <div class="absolute -top-5 -left-5 text-4xl transform -rotate-12">🎀</div>
                <div class="absolute -bottom-5 -right-5 text-4xl transform rotate-12">🎉</div>

                <!-- Celebratory Banner -->
                <div class="inline-block px-4 py-1 bg-pink-100 text-pink-600 rounded-full text-xs font-bold uppercase tracking-wider mb-2">
                    Special Greeting
                </div>

                <!-- Main Greeting Text -->
                <h1 id="greeting-title" class="text-4xl md:text-5xl font-pacifico text-pink-600 text-glow leading-tight my-2">
                    Happy Birthday!
                </h1>

                <!-- Custom Personal Message -->
                <p id="greeting-message" class="text-slate-700 text-lg md:text-xl font-medium mt-4 leading-relaxed">
                    Wishing you a day filled with laughter, joy, sweet surprises, and all the happiness in the world! 🥳✨
                </p>

                <!-- Interactive Re-play & Edit Controls -->
                <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
                    <button onclick="popMoreConfetti()" class="px-5 py-2.5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-semibold rounded-full shadow-lg active:scale-95 transition flex items-center gap-2">
                        <span>Pop More Ribbons!</span> 🎊
                    </button>
                    <button onclick="toggleSettingsModal()" class="px-4 py-2.5 bg-pink-100 hover:bg-pink-200 text-pink-700 font-semibold rounded-full shadow-sm active:scale-95 transition flex items-center gap-1.5 text-sm">
                        <i data-lucide="settings" class="w-4 h-4"></i> Customize
                    </button>
                </div>
            </div>

            <!-- Reset Button -->
            <button onclick="resetGift()" class="mt-6 text-white/80 hover:text-white underline text-sm flex items-center gap-1 transition">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Wrap up box again
            </button>
        </div>

    </main>

    <!-- Customize Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl border-2 border-pink-200 transform transition-all scale-95" id="modal-card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-pink-600 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-5 h-5"></i> Customize Message
                </h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Title</label>
                    <input type="text" id="input-title" value="Happy Birthday!" class="w-full px-4 py-2 border-2 border-pink-100 rounded-xl focus:border-pink-500 focus:outline-none font-semibold text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Message</label>
                    <textarea id="input-message" rows="3" class="w-full px-4 py-2 border-2 border-pink-100 rounded-xl focus:border-pink-500 focus:outline-none font-normal text-slate-700 text-sm">Wishing you a day filled with laughter, joy, sweet surprises, and all the happiness in the world! 🥳✨</textarea>
                </div>

                <!-- Quick Presets -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Quick Presets</label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="setPreset('Happy Birthday! 🎂', 'Wishing you a day filled with laughter, joy, sweet surprises, and all the happiness in the world!')" class="text-xs bg-pink-50 hover:bg-pink-100 text-pink-600 px-3 py-1.5 rounded-lg border border-pink-200">Birthday</button>
                        <button onclick="setPreset('Congratulations! 🎉', 'So proud of you and your amazing accomplishment! Keep shining bright!')" class="text-xs bg-pink-50 hover:bg-pink-100 text-pink-600 px-3 py-1.5 rounded-lg border border-pink-200">Congrats</button>
                        <button onclick="setPreset('Thank You! 💖', 'Sending you so much love and appreciation for everything you do!')" class="text-xs bg-pink-50 hover:bg-pink-100 text-pink-600 px-3 py-1.5 rounded-lg border border-pink-200">Thank You</button>
                        <button onclick="setPreset('Sending Hugs! 🌸', 'Just a sweet little reminder that you are loved and appreciated today!')" class="text-xs bg-pink-50 hover:bg-pink-100 text-pink-600 px-3 py-1.5 rounded-lg border border-pink-200">Hugs</button>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-2">
                <button onclick="saveCustomization()" class="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl shadow-md active:scale-95 transition">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // State Flags
        let isOpened = false;
        let audioSynth = null;

        // Initialize Web Audio Synth via Tone.js
        function initAudio() {
            if (!audioSynth) {
                // Create a synthesizer for celebratory jingle tones
                audioSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
                }).toDestination();
                audioSynth.volume.value = -6;
            }
        }

        // Play celebratory chime sound
        function playCelebrationSound() {
            try {
                Tone.start();
                initAudio();
                
                const now = Tone.now();
                // Happy arpeggio chord sequence
                audioSynth.triggerAttackRelease("C5", "8n", now);
                audioSynth.triggerAttackRelease("E5", "8n", now + 0.1);
                audioSynth.triggerAttackRelease("G5", "8n", now + 0.2);
                audioSynth.triggerAttackRelease("C6", "4n", now + 0.3);
            } catch (e) {
                console.log("Audio play suppressed by browser policy");
            }
        }

        // Open Gift Function
        function openGift() {
            if (isOpened) return;
            isOpened = true;

            const box = document.getElementById('gift-box');
            const pointer = document.getElementById('pointer-sign');
            const giftStage = document.getElementById('gift-stage');
            const revealStage = document.getElementById('reveal-stage');

            // Trigger wiggle animation
            box.classList.add('animate-wiggle');

            // Sound effect
            playCelebrationSound();

            setTimeout(() => {
                // Launch massive ribbon & confetti explosions
                triggerBigExplosion();

                // Hide gift stage smoothly
                giftStage.classList.add('scale-50', 'opacity-0');
                
                setTimeout(() => {
                    giftStage.classList.add('hidden');
                    
                    // Show reveal stage
                    revealStage.classList.remove('hidden');
                    
                    // Trigger reflow to apply scale transition
                    void revealStage.offsetWidth;
                    
                    revealStage.classList.remove('scale-50', 'opacity-0');
                    revealStage.classList.add('scale-100', 'opacity-100');

                    // Start background floating balloon particles on canvas
                    startFloatingBalloons();
                }, 400);

            }, 400);
        }

        // Big Explosion of Confetti, Ribbons, and Streamers
        function triggerBigExplosion() {
            const count = 200;
            const defaults = {
                origin: { y: 0.6 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            // Burst 1: Main colorful pop
            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                colors: ['#f472b6', '#ec4899', '#f43f5e', '#a855f7', '#3b82f6', '#fbbf24']
            });

            // Burst 2: Wide ribbon streamers
            fire(0.2, {
                spread: 60,
                shapes: ['square'],
                colors: ['#ffffff', '#fbcfe8', '#f472b6']
            });

            // Burst 3: High confetti burst
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 1.2
            });

            // Burst 4: Slow floating sparkle ribbon particles
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                scalar: 1.4,
                colors: ['#ffd700', '#ff69b4', '#00ffff']
            });

            // Secondary follow-up explosions for ongoing party vibes
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 50,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 300);
        }

        // Additional manual ribbon pop
        function popMoreConfetti() {
            playCelebrationSound();
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.7 },
                colors: ['#f472b6', '#ec4899', '#fbbf24', '#38bdf8', '#c084fc']
            });
        }

        // Reset Gift Box to initial state
        function resetGift() {
            isOpened = false;
            const giftStage = document.getElementById('gift-stage');
            const revealStage = document.getElementById('reveal-stage');
            const box = document.getElementById('gift-box');

            box.classList.remove('animate-wiggle');

            revealStage.classList.remove('scale-100', 'opacity-100');
            revealStage.classList.add('scale-50', 'opacity-0');

            setTimeout(() => {
                revealStage.classList.add('hidden');
                giftStage.classList.remove('hidden');
                
                void giftStage.offsetWidth;
                
                giftStage.classList.remove('scale-50', 'opacity-0');
                giftStage.classList.add('scale-100', 'opacity-100');
            }, 400);
        }

        // Settings Modal Handlers
        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const card = document.getElementById('modal-card');

            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    card.classList.remove('scale-95');
                    card.classList.add('scale-100');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                card.classList.remove('scale-100');
                card.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        function setPreset(title, msg) {
            document.getElementById('input-title').value = title;
            document.getElementById('input-message').value = msg;
        }

        function saveCustomization() {
            const newTitle = document.getElementById('input-title').value;
            const newMsg = document.getElementById('input-message').value;

            if (newTitle.trim()) {
                document.getElementById('greeting-title').textContent = newTitle;
            }
            if (newMsg.trim()) {
                document.getElementById('greeting-message').textContent = newMsg;
            }

            toggleSettingsModal();
        }

        // Floating Background Balloons Canvas Engine
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');
        let balloons = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Balloon {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.radius = 15 + Math.random() * 15;
                this.speed = 1 + Math.random() * 1.5;
                this.color = ['#f472b6', '#ec4899', '#c084fc', '#60a5fa', '#facc15'][Math.floor(Math.random() * 5)];
                this.swing = Math.random() * 2;
                this.swingSpeed = 0.02 + Math.random() * 0.02;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                this.angle += this.swingSpeed;
                this.x += Math.sin(this.angle) * 0.8;

                if (this.y < -50) {
                    this.y = canvas.height + 50;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.6;
                ctx.fill();

                // Balloon string
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.radius);
                ctx.lineTo(this.x + Math.sin(this.angle) * 5, this.y + this.radius + 25);
                ctx.strokeStyle = '#ffffff';
                ctx.globalAlpha = 0.4;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }
        }

        function startFloatingBalloons() {
            if (balloons.length === 0) {
                for (let i = 0; i < 20; i++) {
                    balloons.push(new Balloon());
                }
                animateBalloons();
            }
        }

        function animateBalloons() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isOpened) {
                balloons.forEach(b => {
                    b.update();
                    b.draw();
                });
            }
            requestAnimationFrame(animateBalloons);
        }
    </script>
</body>
</html>
